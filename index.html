<html>
<!doctype html>
<!-- Declares HTML5 document -->

<html lang="en">
<!-- Starts HTML document -->

<head>

  <!-- Character encoding -->
  <meta charset="utf-8">

  <!-- Makes website responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Browser tab title -->
  <title>Daily Meal Tracker</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Axios AJAX Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>

</head>

<!-- Light background -->
<body class="bg-light">

  <!-- Main page container -->
  <main class="container mt-4">

    <!-- Main heading -->
    <h1 class="text-center mb-4">Daily Meal Tracker 🍣</h1>

    <!-- Healthy Quote Section -->
    <div class="alert alert-success shadow-sm mb-4">

      <h5>Healthy Eating Quote</h5>

      <!-- Quote text -->
      <p id="quoteText">
        Loading healthy quote...
      </p>

      <!-- Button to load another quote -->
      <button class="btn btn-success btn-sm" id="newQuoteBtn">
        Get New Quote
      </button>

    </div>

    <!-- Meal List -->
    <ul class="list-group" id="mealList">

    </ul>

    <!-- Add Meal Form -->
    <h2 class="mt-5">Add New Meal 🍚</h2>

    <!-- Bootstrap card -->
    <div class="card p-3 shadow-sm">

      <!-- Meal Name Input -->
      <div class="mb-3">
        <label class="form-label">Meal Name</label>
        <input type="text" id="mealName" class="form-control">
      </div>

      <!-- Date Input -->
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" id="mealDate" class="form-control">
      </div>

      <!-- Meal Type Dropdown -->
      <div class="mb-3">
        <label class="form-label">Meal Type</label>

        <select id="mealType" class="form-control">
          <option value="Breakfast">Breakfast</option>
          <option value="Lunch">Lunch</option>
          <option value="Dinner">Dinner</option>
          <option value="Snack">Snack</option>
        </select>
      </div>

      <!-- Calories Input -->
      <div class="mb-3">
        <label class="form-label">Calories</label>
        <input type="number" id="calories" class="form-control">
      </div>

      <!-- Add Meal Button -->
      <button class="btn btn-primary" id="addMealBtn">
        Add Meal
      </button>

    </div>

  </main>

  <!-- axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.16.0/dist/axios.min.js"></script>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JavaScript Files -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>

</html>
