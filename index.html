<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Meal Tracker</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

  <main class="container mt-4">

    <h1 class="text-center mb-4">Daily Meal Tracker</h1>

    <!-- Meal List -->
    <ul class="list-group" id="mealList">

    </ul>

    <!-- Add Meal Form -->
    <h2 class="mt-5">Add New Meal</h2>

    <div class="card p-3 shadow-sm">

      <div class="mb-3">
        <label class="form-label">Meal Name</label>
        <input type="text" id="mealName" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" id="mealDate" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Meal Type</label>

        <select id="mealType" class="form-control">
          <option value="Breakfast">Breakfast</option>
          <option value="Lunch">Lunch</option>
          <option value="Dinner">Dinner</option>
          <option value="Snack">Snack</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Calories</label>
        <input type="number" id="calories" class="form-control">
      </div>

      <button class="btn btn-primary" id="addMealBtn">
        Add Meal
      </button>

    </div>

  </main>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JavaScript Files -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>

</html>
